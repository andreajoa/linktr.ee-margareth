name: Atualizar links comerciais

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sales-links.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar links no index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Cartão que antes divulgava materiais gratuitos.
          text = text.replace(
              'href="https://template-link.vercel.app/"',
              'href="https://apostila-promo.vercel.app/"'
          )
          text = text.replace(
              '<h3>Baixe Materiais Grátis</h3>',
              '<h3>Conheça as Apostilas</h3>'
          )
          text = text.replace(
              '<p>Acesso imediato e sem custo</p>',
              '<p>Escolha uma apostila ou leve a coleção completa</p>'
          )

          # Todas as ocorrências conhecidas do antigo endereço do livro.
          old_leo_urls = [
              'https://mundo-do-leo.base44.app/',
              'https://mundo-do-leo.base44.app',
              'https://mundo-colorido-de-leo.base44.app/',
              'https://mundo-colorido-de-leo.base44.app',
          ]
          for old_url in old_leo_urls:
              text = text.replace(old_url, 'https://mundo-colorido-de-leo.vercel.app/')

          if text == original:
              raise SystemExit('Nenhuma substituição foi aplicada. Verifique o conteúdo atual do index.html.')

          if 'Baixe Materiais Grátis' in text:
              raise SystemExit('O texto antigo Baixe Materiais Grátis ainda está presente.')
          if 'mundo-do-leo.base44.app' in text or 'mundo-colorido-de-leo.base44.app' in text:
              raise SystemExit('Um endereço antigo do livro ainda está presente.')
          if 'https://apostila-promo.vercel.app/' not in text:
              raise SystemExit('O novo endereço das apostilas não foi inserido.')
          if 'https://mundo-colorido-de-leo.vercel.app/' not in text:
              raise SystemExit('O novo endereço de O Mundo Colorido de Léo não foi inserido.')

          path.write_text(text, encoding='utf-8')

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza links das apostilas e do livro de Léo"
          git push
