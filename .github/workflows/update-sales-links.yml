name: Atualizar links comerciais

on:
  push:
    branches: [main]
    paths:
      - 'trigger-link-update.txt'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar links
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'https://template-link.vercel.app/',
              'https://apostila-promo.vercel.app/'
          )
          text = text.replace(
              '<div class="lnk-title">Baixe Materiais Grátis</div>',
              '<div class="lnk-title">Apostilas em Oferta</div>'
          )
          text = text.replace(
              '<div class="lnk-sub">Material pedagógico selecionado</div>',
              '<div class="lnk-sub">Escolha uma apostila ou leve a coleção completa</div>'
          )
          text = text.replace(
              '<span class="lnk-badge">free</span>',
              '<span class="lnk-badge">oferta</span>',
              1
          )

          for old_url in (
              'https://mundo-do-leo.base44.app/',
              'https://mundo-do-leo.base44.app',
              'https://mundo-colorido-de-leo.base44.app/',
              'https://mundo-colorido-de-leo.base44.app',
          ):
              text = text.replace(old_url, 'https://mundo-colorido-de-leo.vercel.app/')

          assert 'https://apostila-promo.vercel.app/' in text
          assert 'Baixe Materiais Grátis' not in text
          assert 'mundo-do-leo.base44.app' not in text
          assert 'https://mundo-colorido-de-leo.vercel.app/' in text

          path.write_text(text, encoding='utf-8')

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza links das apostilas e do livro de Léo"
          git push
