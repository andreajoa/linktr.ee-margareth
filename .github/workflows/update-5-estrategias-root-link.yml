name: Corrigir link 5 Estratégias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-5-estrategias-root-link.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Substituir link atual
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          content = path.read_text(encoding='utf-8')
          old = 'https://descobrindo-os-cinco-sentidos-2xii.vercel.app/comprar'
          new = 'https://descobrindo-os-cinco-sentidos-2xii.vercel.app/'

          if old not in content:
              raise SystemExit('Link atual não encontrado em index.html')

          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige link das 5 Estratégias para a página principal"
          git push
